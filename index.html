<style>
:root{
  --bg:#f3f3fb;--card:#ffffff;--ink:#15172a;--muted:#6a6e88;--line:#e3e4f0;--soft:#ebeaf9;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1c;--card:#171a2e;--ink:#eceefb;--muted:#9a9fbe;--line:#262a44;--soft:#202442;--accent:#8c7dff;--accent-ink:#0d0f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f1c;--card:#171a2e;--ink:#eceefb;--muted:#9a9fbe;--line:#262a44;--soft:#202442;--accent:#8c7dff;--accent-ink:#0d0f1c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}

.bar2{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;margin:6px 0}.bar2 i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.qrow{padding:10px 0;border-top:1px solid var(--line)}.qrow:first-of-type{border-top:0;padding-top:0}
.cnt{display:flex;gap:6px;align-items:center}.cnt button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:none;font-size:1.1rem;font-weight:600}.cnt .plus{background:var(--accent);color:var(--accent-ink);border:0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);background:none;flex:none;font-size:.9rem;line-height:1;color:var(--accent-ink);padding:0}

.nudge{background:var(--soft);border-radius:16px;padding:14px;margin:0 0 12px}

.wbar .nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
/* sheets */
.bg{position:fixed;inset:0;z-index:60;background:rgba(8,10,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}

.dayrow{display:flex;gap:6px;margin:4px 0 8px}.dayrow button{flex:1;border:1px solid var(--line);background:none;border-radius:10px;padding:8px 0;font-size:.78rem}.dayrow button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prop{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.prop:first-of-type{border-top:0}
.prop .pt{flex:1;font-size:.92rem;line-height:1.4}.prop small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.kind{font-size:.68rem;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--muted);margin-right:6px}
.brow{display:flex;align-items:center;gap:10px;margin:6px 0}.brow .nm{width:44%;font-size:.84rem;display:flex;align-items:center;gap:6px;min-width:0}.brow .tr{flex:1;height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.brow .tr i{display:block;height:100%;border-radius:6px}.brow .v{width:70px;white-space:nowrap;text-align:right;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}.dots i{width:22px;height:22px;border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-style:normal;color:var(--muted)}.dots i.d{background:var(--ok);color:#fff}.dots i.m{background:none;border:1.5px dashed var(--bad);color:var(--bad)}.dots i.n{opacity:.3}
.big{font-family:var(--disp);font-size:1.7rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px}.tile{background:var(--card);border-radius:16px;padding:12px}.tile small{display:block;color:var(--muted);font-size:.74rem;margin-top:4px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
#tabs .in{max-width:640px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;font-size:.68rem;color:var(--muted)}.tab svg{width:23px;height:23px}.tab.on{color:var(--accent);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.86rem;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw}#toast.on{opacity:1}

.legend.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;justify-content:stretch}
.legend.g2 span{white-space:pre-line;line-height:1.35;align-items:flex-start;text-align:left}.legend.g2 i{margin-top:3px}

.chain{position:relative;padding-left:26px}
.chain::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:3px;background:linear-gradient(#7b6cf0,#1fa67a,#ff7a45);border-radius:2px;opacity:.55}
.cnode{position:relative}
.cnode::before{content:"";position:absolute;left:-26px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.linkrow{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left;color:inherit}
.linkrow:first-of-type{margin-top:6px}
.dots.sm{gap:3px}.dots.sm i{width:9px;height:9px;border-radius:50%}

</style>

<body>
<div id="main"></div>
<div id="tabs"><div class="in" id="tabin"></div></div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script>
(function(){
/* ---------- plain-words sorter ---------- */
const DAYRE=/\b(sun(?:day)?s?|mon(?:day)?s?|tue(?:s(?:day)?)?s?|wed(?:nesday)?s?|thu(?:r(?:s(?:day)?)?)?s?|fri(?:day)?s?|sat(?:urday)?s?)\b/gi;
const DOWMAP={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
const dowOf=w=>DOWMAP[w.toLowerCase().slice(0,3)];
const WEEKDAYS=[1,2,3,4,5],WEEKEND=[6,0],ALLDAYS=[1,2,3,4,5,6,0];
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const norm=s=>' '+s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()+' ';
function splitSentences(text){
  return String(text||'').replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,'-').split(/\n+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
}
function bucketsIn(sentence,buckets){
  const ns=norm(sentence),toks=new Set(ns.trim().split(' ')),firsts={};
  buckets.forEach(b=>{const w=norm(b.name).trim().split(' ')[0];firsts[w]=(firsts[w]||0)+1});
  const hits=[];
  buckets.forEach(b=>{
    const nb=norm(b.name),w0=nb.trim().split(' ')[0],joined=nb.replace(/ /g,'');
    let pos=ns.indexOf(nb);
    if(pos<0&&joined.length>=4&&toks.has(joined))pos=ns.indexOf(' '+joined+' ');
    if(pos<0&&w0.length>=5&&firsts[w0]===1&&toks.has(w0))pos=ns.indexOf(' '+w0+' ');
    if(pos>=0)hits.push({b,pos});
  });
  return hits.sort((a,c)=>a.pos-c.pos).map(h=>h.b);
}
function dayTokens(s){
  const out=[];let m;DAYRE.lastIndex=0;
  while((m=DAYRE.exec(s)))out.push({pos:m.index,dows:[dowOf(m[1])]});
  const re=[[/\bweekdays\b/gi,WEEKDAYS],[/\bweekends?\b/gi,WEEKEND],[/\b(every ?day|daily|each day)\b/gi,ALLDAYS]];
  re.forEach(([r,d])=>{let k;while((k=r.exec(s)))out.push({pos:k.index,dows:d})});
  return out.sort((a,b)=>a.pos-b.pos);
}
function h24(h,mer){h=h%12;return mer==='pm'?h+12:h}
const RANGERE=/(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\s*(?:-|to|until|till)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?/gi;
function rangeTokens(s){
  const out=[];let m;RANGERE.lastIndex=0;
  while((m=RANGERE.exec(s))){
    const mer=x=>x?(x[0].toLowerCase()==='a'?'am':'pm'):null;
    let h1=+m[1],m1=+(m[2]||0),a1=mer(m[3]),h2=+m[4],m2=+(m[5]||0),a2=mer(m[6]);
    if(h1>12||h2>12||m1>59||m2>59)continue;
    let guess=false;
    if(!a1&&!a2){guess=true;a1=(h1>=7&&h1<=11)?'am':'pm';a2=a1}else if(a1&&!a2)a2=a1;else if(!a1&&a2)a1=a2;
    let st=h24(h1,a1)*60+m1,en=h24(h2,a2)*60+m2;
    if(en<=st)en+=12*60;
    if(en<=st)en+=1440;
    out.push({pos:m.index,start:st,end:en,guess});
  }
  return out;
}
const hmm=min=>{min=((min%1440)+1440)%1440;return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0')};
function durations(s){
  const out=[];const re=/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?)\b/gi;let m;
  while((m=re.exec(s)))out.push({pos:m.index,min:Math.round(+m[1]*(/^h/i.test(m[2])?60:1))});
  const re2=/\b(half an hour|an hour|one hour|an hr)\b/gi;while((m=re2.exec(s)))out.push({pos:m.index,min:/half/i.test(m[1])?30:60});
  return out.sort((a,b)=>a.pos-b.pos);
}
const MEETRE=/\b(meetings?|stand-?up|class(?:es)?|lectures?|sessions?|appointments?|interviews?|sync|training|service|webinar|events?|shift|check-?in)\b/i;
const QUOTARE=/\b(call|contact|email|text|message|send|submit|write|post|apply|visit|dial)\w*\b\s+(?:at least\s+|about\s+|around\s+)?(\d+)\s+([a-z][a-z\- ]{1,40}?)\s+(?:in a day|a day|per day|each day|every day|daily|in a week|a week|per week|weekly)\b/i;
const DEADRE=/\b(?:goal|milestone|deliverable|deadline|target|task|finish|complete|submit|deliver|due)\b[^.]*?\b(?:by|before|due(?:\s+on)?)\s+(sun(?:day)?|mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:r(?:s(?:day)?)?)?|fri(?:day)?|sat(?:urday)?)\b/i;
const LEFTRE=/(left with|remaining time|free time|rest of (?:my )?time|managing myself|manage myself|on my own|self[- ]manag)/i;
const LIGHTRE=/\b(walk|meditat|podcast|sermon|church|pray|stretch|listen|relax|rest)/i;
function actStems(name){return name.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>=3).map(w=>w.slice(0,w.length>=5?4:3))}
function activityIn(sentence,buckets){
  const low=sentence.toLowerCase(),found=[];
  buckets.forEach(b=>(b.activities||[]).forEach(a=>{
    const st=actStems(a.name);if(!st.length)return;
    const need=st.length>=2?2:1;let n=0,first=Infinity;
    st.forEach(x=>{const i=low.search(new RegExp('\\b'+x));if(i>=0){n++;first=Math.min(first,i)}});
    if(n>=need)found.push({a,b,pos:first,score:n});
  }));
  return found.sort((x,y)=>y.score-x.score||x.pos-y.pos);
}
function freqOf(s){
  const low=s.toLowerCase();let m;
  const dt=dayTokens(s);
  if(/\b(every ?day|daily|each day|everyday)\b/.test(low))return{perWeek:7,days:ALLDAYS};
  if(/\bweekdays\b/.test(low))return{perWeek:5,days:WEEKDAYS};
  if(/\bweekends?\b/.test(low))return{perWeek:2,days:WEEKEND};
  if((m=low.match(/(\d+)\s*(?:x|times?)\s*(?:a|per|each|every)\s*week/)))return{perWeek:+m[1],days:[]};
  if((m=low.match(/(\d+)\s*days?\s*(?:a|per|each|every)\s*week/)))return{perWeek:+m[1],days:[]};
  if(/\btwice\s*(?:a|per|each)\s*week/.test(low))return{perWeek:2,days:[]};
  if(/\bonce\s*(?:a|per|each)\s*week|\bweekly\b/.test(low))return{perWeek:1,days:[]};
  if(dt.length){const d=[...new Set(dt.flatMap(t=>t.dows))];return{perWeek:d.length,days:d}}
  return null;
}
function parseText(text,buckets,kind){
  const out={proposals:[],ignored:[]};
  let ctx=null;
  splitSentences(text).forEach(sent=>{
    const bs=bucketsIn(sent,buckets);if(bs.length)ctx=bs[0];
    let bucket=bs[0]||ctx;const notes=[],made=[];
    if(!bucket){const a0=activityIn(sent,buckets)[0];if(a0)bucket=a0.b}
    if(kind==='goals')return;
    const low=sent.toLowerCase();
    // 1. fixed commitments
    const ranges=rangeTokens(sent),days=dayTokens(sent);
    if(MEETRE.test(sent)&&(ranges.length||days.length)&&!(QUOTARE.test(sent)&&!/^(times?|days?|sessions?|hours?|hrs?|mins?|minutes?|x)$/i.test((sent.match(QUOTARE)||[])[3]||''))){
      const word=(sent.match(MEETRE)[1]||'meeting').toLowerCase().replace(/s$/,'');
      const title=(bucket?bucket.name+' ':'')+word;
      const groups={};
      ranges.forEach(r=>{
        let d=null;days.forEach(t=>{if(t.pos<r.pos)d=t});
        if(!d)d=days.find(t=>t.pos>r.pos)||null;
        const key=r.start+'-'+r.end;
        (groups[key]=groups[key]||{start:r.start,end:r.end,guess:r.guess,days:[]});
        if(d)d.dows.forEach(x=>{if(!groups[key].days.includes(x))groups[key].days.push(x)});
      });

/* what travels: everything except things that belong to this device only */
